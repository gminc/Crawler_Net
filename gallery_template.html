<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 價格吊牌式的商品牆 — 上方固定篩選列，下方等寬卡片網格；右下角購物清單按鈕，展開為側欄（手機為底部抽屜） */
/* 固定白底單一主題 */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #1b1f1e;
  --muted: #69716d;
  --line: #e3e6e4;
  --chip: #f3f5f4;
  --tag: #c4281c;        /* 吊牌紅：活動價 */
  --tw: #1f6b4f;         /* 台灣製標示、完成狀態 */
  --focus: #2d5bd7;
  --shade: rgba(27, 31, 30, .32);
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
button { font-family: inherit; }
.wrap { overflow-x: clip; max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 120px; }

header { display: grid; gap: 10px; padding-bottom: 18px; }
header, .bar > * { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
h1 { margin: 0; font-weight: 900; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.15; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
.facts b { color: var(--ink); font-family: var(--num); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 1px solid var(--line); padding-block: 10px; display: grid; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row > .lab { flex: none; width: 34px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.scroller { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding-block: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 500 13px/1.2 var(--body); cursor: pointer; }
.pill .n { color: var(--muted); font-family: var(--num); margin-left: 4px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill[aria-pressed="true"] .n { color: #c9cfcc; }
.pill.size { font-family: var(--num); font-size: 15px; padding: 3px 11px; letter-spacing: .02em; }
select { font: 500 13px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.result { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(208px, 100%), 1fr)); gap: 28px 18px; padding-top: 20px; }
.card { display: grid; gap: 8px; align-content: start; min-width: 0; }
.photo { position: relative; display: block; aspect-ratio: 345 / 480; max-width: 100%; background: var(--chip); border-radius: 4px; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.origin { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,.94); border: 1px solid var(--line); color: var(--ink); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; }
.origin.tw { background: var(--tw); border-color: var(--tw); color: #fff; }
.name { font-weight: 700; font-size: 14.5px; line-height: 1.35; margin: 2px 0 0; }
.price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-family: var(--num); font-variant-numeric: tabular-nums; }
.price .now { color: var(--tag); font-weight: 700; font-size: 24px; line-height: 1; }
.price .now small { font-size: 13px; margin-right: 1px; }
.price .was { color: var(--muted); text-decoration: line-through; font-size: 15px; }
.price .per { font-family: var(--body); font-size: 11px; color: var(--muted); }
.colors { display: flex; flex-wrap: wrap; gap: 5px; }
.cbtn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; padding: 2px 7px; font: 400 12px/1.4 var(--body); cursor: pointer; }
.cbtn .code { font-family: var(--num); color: var(--muted); margin-right: 3px; }
.cbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cbtn.dim { opacity: .4; }
.sizes { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.sizes .lab { font-size: 11px; color: var(--muted); margin-right: 2px; flex-basis: 100%; }
.sz { position: relative; min-width: 34px; text-align: center; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 3px; padding: 2px 7px; font: 500 14px/1.3 var(--num); cursor: pointer; }
.sz:hover { background: var(--chip); }
.sz.hit { box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
.sz.in { background: var(--ink); color: var(--bg); }
.sz .q { position: absolute; top: -7px; right: -7px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--tag); color: #fff; font: 700 11px/16px var(--num); padding-inline: 3px; }
.go { justify-self: start; font-size: 12.5px; color: var(--ink); text-underline-offset: 3px; }
.go:hover { color: var(--tag); }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: grid; gap: 4px; max-width: 70ch; }
footer a { color: inherit; }

/* 購物清單 */
.cartbtn { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 18px; font: 700 14px var(--body); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.cartbtn .sum { font-family: var(--num); font-size: 18px; }
.cartbtn .cnt { background: var(--tag); border-radius: 999px; min-width: 22px; height: 22px; padding-inline: 6px; font: 700 13px/22px var(--num); text-align: center; }
.shade { position: fixed; inset: 0; z-index: 30; background: var(--shade); }
.drawer { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; box-shadow: -8px 0 30px rgba(0,0,0,.12); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 18px; font-weight: 900; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--ink); }
.dbody { overflow-y: auto; padding: 12px 16px; display: grid; gap: 12px; align-content: start; }
.promo { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; display: grid; gap: 6px; }
.promo b { font-weight: 700; }
.promo.ok { border-color: var(--tw); }
.promo .st { color: var(--tag); font-weight: 700; }
.promo.ok .st { color: var(--tw); }
.meter { display: flex; gap: 3px; }
.meter i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--tag); }
.promo.ok .meter i.on { background: var(--tw); }
.item { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.item img { width: 52px; aspect-ratio: 345 / 480; object-fit: cover; border-radius: 3px; background: var(--chip); }
.item .t { font-weight: 700; font-size: 13px; line-height: 1.35; min-width: 0; }
.item .v { color: var(--muted); font-size: 12px; }
.item .v b { color: var(--ink); font-family: var(--num); font-size: 14px; }
.item a { font-size: 12px; color: var(--ink); text-underline-offset: 3px; }
.item .r { display: grid; gap: 6px; justify-items: end; font-family: var(--num); font-variant-numeric: tabular-nums; }
.item .p { font-size: 17px; font-weight: 700; }
.step { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; }
.step button { border: 0; background: none; width: 26px; height: 26px; cursor: pointer; font-size: 15px; color: var(--ink); }
.step span { min-width: 18px; text-align: center; font-size: 15px; }
.dfoot { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; }
.tot { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; }
.tot span:nth-child(even) { text-align: right; font-family: var(--num); font-size: 16px; font-variant-numeric: tabular-nums; }
.tot .big { font-weight: 700; font-size: 15px; }
.tot span.big:nth-child(even) { font-size: 24px; color: var(--tag); }
.note { font-size: 11.5px; color: var(--muted); margin: 0; }
.acts { display: flex; gap: 8px; }
.acts button { flex: 1; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 9px; font-weight: 700; cursor: pointer; }
.acts button.primary { background: var(--ink); color: var(--bg); }
.acts button.warn { border-color: var(--tag); color: var(--tag); }
.copybox { width: 100%; min-height: 120px; font: 12px/1.5 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.dempty { color: var(--muted); text-align: center; padding: 36px 8px; line-height: 1.8; white-space: pre-line; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; max-width: calc(100% - 32px); }

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  .price .now { font-size: 21px; }
  .result { display: none; }
  .drawer { top: auto; left: 0; width: 100%; max-height: 85%; border-radius: 12px 12px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.12); }
}
@media (prefers-reduced-motion: no-preference) { .photo img { transition: opacity .15s; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">NET 線上購物 ・ 商品清單</div>
    <h1>{{TITLE}}</h1>
    <div class="facts" id="facts">
      <span><b id="f-styles">0</b> 款</span>
      <span><b id="f-colors">0</b> 個顏色</span>
      <span id="f-origins"></span>
      <span>資料時間 {{STAMP}}</span>
    </div>
  </header>

  <div class="bar" role="region" aria-label="篩選">
    <div class="row"><span class="lab">分類</span><div class="scroller" id="cats"></div></div>
    <div class="row"><span class="lab">尺寸</span><div class="scroller" id="sizes"></div></div>
    <div class="row">
      <span class="lab">排序</span>
      <select id="sort" aria-label="排序">
        <option value="price">價格 低 → 高</option>
        <option value="price-desc">價格 高 → 低</option>
        <option value="sizes">尺寸最齊全</option>
      </select>
      <button class="pill" id="tw" aria-pressed="false" type="button">只看台灣製</button>
      <span class="result" id="result"></span>
    </div>
  </div>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>沒有符合的商品。換個尺寸或分類試試。</p>

  <footer>
    <span>點卡片上的尺寸就會加入購物清單。清單只存在這個瀏覽器，結帳要到 NET 網站把商品加入購物車。</span>
    <span>紅字是商品頁顯示的售價（有活動時已是活動價），刪除線是原價。</span>
    <span>庫存是資料時間當下的網站資料，熱門尺寸可能很快賣完，下單前請點「看商品頁」確認。</span>
    <span id="src"></span>
  </footer>
</div>

<button class="cartbtn" id="cartbtn" type="button" aria-haspopup="dialog">購物清單 <span class="sum" id="cb-sum">$0</span><span class="cnt" id="cb-cnt">0</span></button>
<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="dhead"><h2 id="d-title">購物清單</h2><button class="x" id="d-close" type="button" aria-label="關閉">×</button></div>
  <div class="dbody" id="d-body"></div>
  <div class="dfoot" id="d-foot"></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*DATA*/[];
const META = /*META*/{};
const STORE_KEY = 'net-gallery:' + document.title;
const CAT_ORDER = ['上衣', '褲・裙', '洋裝', '外套', '童裝', '配件'];
const SIZE_ORDER = ['XS', 'S', 'M', 'L', 'XL', '2XL', 'XXL', '3XL', 'F'];
const sizeKey = s => {
  const i = SIZE_ORDER.indexOf(s);
  if (i >= 0) return [0, i];
  const n = parseFloat(s);
  return isNaN(n) ? [2, 0] : [s.endsWith('cm') ? 1 : 1.5, n];
};
const bySize = (a, b) => { const x = sizeKey(a), y = sizeKey(b); return x[0] - y[0] || x[1] - y[1]; };
const money = n => '$' + Math.round(n).toLocaleString('en-US');

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; } };
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ sort: state.sort, cart: state.cart })); } catch (e) {} };

/* 每個顏色用商品連結當 key */
const COLORS = new Map();
DATA.forEach(st => st.colors.forEach(c => COLORS.set(c.link, { st, c })));

const saved = load();
const state = {
  cat: '全部', sizes: new Set(), tw: false, sort: saved.sort || 'price', pick: {},
  // 購物清單：[{link, size, qty}]；資料更新後已不存在的商品自動移除
  cart: (saved.cart || []).filter(x => COLORS.has(x.link)),
};

/* ---------- 活動價估算 ---------- */
// 「任選 3件 5折」：每湊滿 3 件，這 3 件用活動價（商品頁售價），湊不滿的用原價
// 「任選 3件 249」：每湊滿 3 件合計 249，湊不滿的用商品頁售價
function promoRule(text) {
  let m = (text || '').match(/任選\s*(\d+)\s*件\s*([\d.]+)\s*折/);
  if (m) return { n: +m[1], kind: 'pct' };
  m = (text || '').match(/任選\s*(\d+)\s*件\s*(\d+)\s*元?\s*$/);
  if (m) return { n: +m[1], kind: 'bundle', total: +m[2] };
  return null;
}
function cartSummary() {
  const units = [];
  state.cart.forEach(x => { const { c } = COLORS.get(x.link); for (let i = 0; i < x.qty; i++) units.push(c); });
  const groups = new Map();
  units.forEach(c => { const k = promoRule(c.promo) ? c.promo : ''; groups.set(k, [...(groups.get(k) || []), c]); });
  let pay = 0, orig = 0;
  const promos = [];
  groups.forEach((list, promo) => {
    list.forEach(c => orig += c.orig);
    const rule = promoRule(promo);
    if (!rule) { list.forEach(c => pay += c.price); return; }
    const sorted = [...list].sort((a, b) => b.orig - a.orig); // 貴的先湊成一組
    const full = Math.floor(sorted.length / rule.n) * rule.n;
    if (rule.kind === 'pct') {
      sorted.forEach((c, i) => pay += i < full ? c.price : c.orig);
    } else {
      pay += (full / rule.n) * rule.total;
      sorted.slice(full).forEach(c => pay += c.price);
    }
    promos.push({ promo, n: rule.n, count: list.length, need: (rule.n - list.length % rule.n) % rule.n });
  });
  return { count: units.length, pay, orig, promos };
}

/* ---------- 商品牆 ---------- */
function colorMatches(c) {
  if (state.tw && c.origin !== '台灣') return false;
  if (state.sizes.size && !c.sizes.some(s => state.sizes.has(s))) return false;
  return true;
}
const visibleStyles = () => DATA.filter(st => (state.cat === '全部' || st.cat === state.cat) && st.colors.some(colorMatches));
const qtyOf = (link, size) => (state.cart.find(x => x.link === link && x.size === size) || {}).qty || 0;

function renderFilters() {
  const counts = {};
  DATA.forEach(st => counts[st.cat] = (counts[st.cat] || 0) + 1);
  const cats = $('cats'); cats.textContent = '';
  ['全部', ...CAT_ORDER.filter(c => counts[c])].forEach(c => {
    const b = el('button', 'pill', c); b.type = 'button';
    b.append(el('span', 'n', c === '全部' ? DATA.length : counts[c]));
    b.setAttribute('aria-pressed', state.cat === c);
    b.onclick = () => { state.cat = c; render(); };
    cats.append(b);
  });
  const all = [...new Set(DATA.flatMap(st => st.colors.flatMap(c => c.sizes)))].sort(bySize);
  const sz = $('sizes'); sz.textContent = '';
  all.forEach(s => {
    const b = el('button', 'pill size', s); b.type = 'button';
    b.setAttribute('aria-pressed', state.sizes.has(s));
    b.onclick = () => { state.sizes.has(s) ? state.sizes.delete(s) : state.sizes.add(s); render(); };
    sz.append(b);
  });
  $('tw').setAttribute('aria-pressed', state.tw);
  $('tw').hidden = !DATA.some(st => st.colors.some(c => c.origin === '台灣'));
  $('sort').value = state.sort;
}

function card(st) {
  const matching = st.colors.filter(colorMatches);
  let idx = state.pick[st.name];
  if (idx == null || !colorMatches(st.colors[idx])) idx = st.colors.indexOf(matching[0]);
  const c = st.colors[idx];

  const art = el('article', 'card');
  const photo = el('a', 'photo'); photo.href = c.link; photo.target = '_blank'; photo.rel = 'noopener';
  if (c.img) { const img = el('img'); img.src = c.img; img.alt = `${st.name} ${c.color}`; img.loading = 'lazy'; photo.append(img); }
  if (c.origin) photo.append(el('span', 'origin' + (c.origin === '台灣' ? ' tw' : ''), c.origin === '未標示' ? '產地未標示' : c.origin + '製'));

  const price = el('div', 'price');
  const now = el('span', 'now'); now.append(el('small', null, '$'), document.createTextNode(c.price));
  price.append(now);
  if (c.orig > c.price) price.append(el('span', 'was', '$' + c.orig));
  // 全頁只有一個活動時，活動名稱已經在標題，卡片上不重複
  price.append(el('span', 'per', c.promo && (META.promos || []).length > 1 ? c.promo : '/ 件'));

  const colors = el('div', 'colors');
  st.colors.forEach((cc, i) => {
    const b = el('button', 'cbtn' + (colorMatches(cc) ? '' : ' dim')); b.type = 'button';
    if (cc.code) b.append(el('span', 'code', cc.code));
    b.append(document.createTextNode(cc.color || '單一顏色'));
    b.setAttribute('aria-pressed', i === idx);
    b.title = '有貨尺寸：' + (cc.sizes.join(' ') || '無');
    b.onclick = () => { state.pick[st.name] = i; art.replaceWith(card(st)); };
    colors.append(b);
  });

  const sizes = el('div', 'sizes');
  sizes.append(el('span', 'lab', c.sizes.length ? '有貨尺寸（點一下加入清單）' : '沒有庫存資料'));
  [...c.sizes].sort(bySize).forEach(s => {
    const q = qtyOf(c.link, s);
    const b = el('button', 'sz' + (state.sizes.has(s) ? ' hit' : '') + (q ? ' in' : ''), s); b.type = 'button';
    b.setAttribute('aria-label', `把 ${c.color} ${s} 加入購物清單` + (q ? `（已有 ${q} 件）` : ''));
    if (q) b.append(el('span', 'q', q));
    b.onclick = () => addToCart(c.link, s);
    sizes.append(b);
  });

  const go = el('a', 'go', '看商品頁 →'); go.href = c.link; go.target = '_blank'; go.rel = 'noopener';
  art.append(photo, el('h2', 'name', st.name), price, colors, sizes, go);
  return art;
}

function render() {
  renderFilters();
  const list = visibleStyles();
  const minPrice = st => Math.min(...st.colors.filter(colorMatches).map(c => c.price));
  const sizeCount = st => new Set(st.colors.flatMap(c => c.sizes)).size;
  list.sort(state.sort === 'price' ? (a, b) => minPrice(a) - minPrice(b)
          : state.sort === 'price-desc' ? (a, b) => minPrice(b) - minPrice(a)
          : (a, b) => sizeCount(b) - sizeCount(a));
  const grid = $('grid'); grid.textContent = '';
  list.forEach(st => grid.append(card(st)));
  $('empty').hidden = list.length > 0;
  $('result').textContent = `顯示 ${list.length} 款`;
  renderCartButton();
}

/* ---------- 購物清單 ---------- */
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 1800);
}
function addToCart(link, size) {
  const hit = state.cart.find(x => x.link === link && x.size === size);
  hit ? hit.qty++ : state.cart.push({ link, size, qty: 1 });
  save(); render();
  const { st, c } = COLORS.get(link);
  toast(`已加入：${st.name} ${c.color} ${size}`);
  if (!$('drawer').hidden) renderDrawer();
}
function setQty(i, qty) {
  if (qty <= 0) state.cart.splice(i, 1); else state.cart[i].qty = qty;
  save(); render(); renderDrawer();
}
function renderCartButton() {
  const s = cartSummary();
  $('cb-cnt').textContent = s.count;
  $('cb-sum').textContent = money(s.pay);
}
let clearArmed = false;
function renderDrawer() {
  const body = $('d-body'), foot = $('d-foot'), s = cartSummary();
  body.textContent = ''; foot.textContent = '';
  if (!state.cart.length) {
    body.append(el('p', 'dempty', '清單是空的。\n在商品卡片上點尺寸，就會加到這裡。'));
    return;
  }
  s.promos.forEach(p => {
    const box = el('div', 'promo' + (p.need ? '' : ' ok'));
    const line = el('div'); line.append(el('b', null, p.promo + '：'), document.createTextNode(`已選 ${p.count} 件，`));
    line.append(el('span', 'st', p.need ? `再 ${p.need} 件湊滿 ${p.count + p.need} 件` : '已湊滿'));
    const meter = el('div', 'meter');
    const slots = Math.ceil(Math.max(p.count, 1) / p.n) * p.n;
    for (let i = 0; i < slots; i++) meter.append(el('i', i < p.count ? 'on' : ''));
    box.append(line, meter); body.append(box);
  });
  state.cart.forEach((x, i) => {
    const { st, c } = COLORS.get(x.link);
    const row = el('div', 'item');
    const img = el('img'); if (c.img) img.src = c.img; img.alt = '';
    const mid = el('div'); mid.style.minWidth = '0';
    const v = el('div', 'v'); v.append(document.createTextNode((c.color || '單一顏色') + ' ・ 尺寸 '), el('b', null, x.size));
    const a = el('a', null, '到 NET 加入購物車 →'); a.href = c.link; a.target = '_blank'; a.rel = 'noopener';
    mid.append(el('div', 't', st.name), v, a);
    const r = el('div', 'r');
    r.append(el('span', 'p', money(c.price * x.qty)));
    const step = el('div', 'step');
    const minus = el('button', null, x.qty > 1 ? '−' : '×'); minus.type = 'button';
    minus.setAttribute('aria-label', x.qty > 1 ? '減少一件' : '從清單移除');
    minus.onclick = () => setQty(i, x.qty - 1);
    const plus = el('button', null, '+'); plus.type = 'button'; plus.setAttribute('aria-label', '增加一件');
    plus.onclick = () => setQty(i, x.qty + 1);
    step.append(minus, el('span', null, x.qty), plus);
    r.append(step);
    row.append(img, mid, r); body.append(row);
  });

  const tot = el('div', 'tot');
  tot.append(el('span', null, `原價合計（${s.count} 件）`), el('span', null, money(s.orig)));
  if (s.orig > s.pay) tot.append(el('span', null, '省下'), el('span', null, '−' + money(s.orig - s.pay)));
  tot.append(el('span', 'big', '估計金額'), el('span', 'big', money(s.pay)));
  const note = el('p', 'note', '依活動規則估算（湊不滿的件數用原價），實際金額以 NET 結帳為準，不含運費。');
  const acts = el('div', 'acts');
  const copy = el('button', 'primary', '複製清單'); copy.type = 'button'; copy.onclick = copyList;
  const clear = el('button', clearArmed ? 'warn' : '', clearArmed ? '確定清空？' : '清空'); clear.type = 'button';
  clear.onclick = () => {
    if (!clearArmed) { clearArmed = true; renderDrawer(); setTimeout(() => { clearArmed = false; if (!$('drawer').hidden) renderDrawer(); }, 3000); return; }
    clearArmed = false; state.cart = []; save(); render(); renderDrawer();
  };
  acts.append(copy, clear);
  foot.append(tot, note, acts);
}
function listText() {
  const s = cartSummary();
  const lines = state.cart.map(x => {
    const { st, c } = COLORS.get(x.link);
    return `${st.name}｜${c.code}${c.color}｜${x.size} ×${x.qty}｜${money(c.price * x.qty)}\n${c.link}`;
  });
  return `${document.title}（${s.count} 件，估計 ${money(s.pay)}）\n\n` + lines.join('\n\n');
}
function copyList() {
  const text = listText();
  const done = () => toast('已複製，可以貼到記事本或 LINE');
  try {
    navigator.clipboard.writeText(text).then(done, () => showCopyBox(text));
  } catch (e) { showCopyBox(text); }
}
function showCopyBox(text) {
  const box = el('textarea', 'copybox'); box.id = 'copybox'; box.value = text; box.readOnly = true;
  $('d-body').prepend(box); box.focus(); box.select();
  toast('無法自動複製，請長按或 Ctrl+C 複製選取的文字');
}
let lastFocus;
function openDrawer() {
  lastFocus = document.activeElement;
  renderDrawer(); $('drawer').hidden = false; $('shade').hidden = false; $('d-close').focus();
}
function closeDrawer() {
  $('drawer').hidden = true; $('shade').hidden = true; if (lastFocus) lastFocus.focus();
}
$('cartbtn').onclick = openDrawer;
$('d-close').onclick = closeDrawer;
$('shade').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });

/* ---------- 啟動 ---------- */
$('sort').onchange = e => { state.sort = e.target.value; save(); render(); };
$('tw').onclick = () => { state.tw = !state.tw; render(); };
$('f-styles').textContent = DATA.length;
$('f-colors').textContent = DATA.reduce((n, st) => n + st.colors.length, 0);
$('f-origins').textContent = '產地：' + (META.origins || []).map(([o, n]) => `${o} ${n}`).join('・');
const src = $('src');
if ((META.sources || []).length) {
  src.append(document.createTextNode('來源：'));
  META.sources.forEach((s, i) => {
    if (i) src.append(document.createTextNode('、'));
    const a = el('a', null, s.label); a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; src.append(a);
  });
}
render();
</script>
